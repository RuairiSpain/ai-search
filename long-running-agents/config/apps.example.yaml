# Example gateway configuration. Copy to apps.yaml and edit.
# Field-by-field reference: docs/01-gateway-config-and-adapter-contract.md §1
#
# T1 (prompt agents) is not configured here — this gateway fronts T2/T3
# only. T1 gets Foundry's own native incoming A2A directly; see
# docs/00-tier-model-and-concepts.md §4.

auth:
  tenant_id: ${GATEWAY_TENANT_ID}
  # Audience of the GATEWAY's own app registration.
  # NOT https://ai.azure.com — the client authenticates to us, not to Foundry.
  audience: api://a2a-gateway
  # Claim used as the stable subject. oid is immutable per user per tenant.
  # NEVER email/upn/preferred_username: mutable, and addresses get recycled.
  subject_claim: oid

# L023 (gwlint, D6): required whenever any app's card declares
# pushNotifications: true — GatewayPushConfigStore fails registration
# closed against an empty allowlist, so this isn't optional once a client
# might actually try to register a callback.
push_notification_allowlist:
  - push.example.com

apps:
  - name: ticket-triage
    tier: t2
    upstream: triage-hosted
    default_mode: long
    # T2 (hosted agents) is itself a preview feature end to end (docs/05
    # §3 — FoundryHostedAdapter always sends Foundry-Features:
    # HostedAgents=V1Preview). preview: deny would mean "GA only," which
    # a T2 app can never satisfy — see D10's "preview: deny means tier 1
    # only" note in docs/02-decisions.md.
    preview: allow

  - name: deep-research
    tier: t3
    upstream: research-pool
    default_mode: long
    # T3's whole stack is prerelease (agent-framework-a2a/-durabletask/
    # -azurefunctions, all pinned --pre — docs/01 §3), so preview: deny
    # is unsatisfiable here too, same reasoning as ticket-triage above.
    preview: allow
    card:
      description: Long-running research agent
      capabilities: { streaming: false, pushNotifications: true }
      # streaming: false — the T3 A2A server pushes via webhook, it does
      # not hold an SSE connection. See docs/06-tier3-durable-agents.md §4.1.

upstreams:
  - id: triage-hosted
    tier: t2
    project_endpoint: ${FOUNDRY_PROJECT_ENDPOINT}
    agent_name: triage-agent
    identity: per_user            # per_user (default) | service

  - id: research-pool
    tier: t3
    protocol: a2a
    instances: ["https://rs-1.internal", "https://rs-2.internal"]
    health: /healthz
