# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json
name: t1-code-interpreter-shared-memory

services:
  ai-project:
    host: azure.ai.project
    deployments:
      - name: ${FOUNDRY_MODEL_DEPLOYMENT}
        model: { format: OpenAI, name: gpt-5.4-mini, version: "2026-03-17" }
        sku:   { name: GlobalStandard, capacity: 50 }

  calculator:
    host: azure.ai.agent
    uses: [ai-project]
    $ref: ./agents/calculator.yaml

  flashcard-formatter:
    host: azure.ai.agent
    uses: [ai-project]
    $ref: ./agents/flashcard-formatter.yaml

  calc-to-flashcard:
    host: azure.ai.workflow          # preview -- D10, blocked under preview: deny
    uses: [ai-project, calculator, flashcard-formatter]
    $ref: ./workflows/calc-to-flashcard.workflow.yaml
