# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json
name: t1-workflow-executor-reviewer

services:
  ai-project:
    host: azure.ai.project
    deployments:
      - name: ${FOUNDRY_MODEL_DEPLOYMENT}
        model: { format: OpenAI, name: gpt-5.4-mini, version: "2026-03-17" }
        sku:   { name: GlobalStandard, capacity: 50 }

  executor:
    host: azure.ai.agent
    uses: [ai-project]
    $ref: ./agents/executor.yaml

  reviewer:
    host: azure.ai.agent
    uses: [ai-project]
    $ref: ./agents/reviewer.yaml

  review-loop:
    host: azure.ai.workflow          # preview -- D10, blocked under preview: deny
    uses: [ai-project, executor, reviewer]
    $ref: ./workflows/review-loop.workflow.yaml
