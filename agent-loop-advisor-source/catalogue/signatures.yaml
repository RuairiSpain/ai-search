# The §2 Pattern Selection Guide, as data.
#
# A signature is a diagnosis, not a pattern. Diagnosis is multi-label: real
# projects usually match three or four of these. `pattern` names the folder
# that answers the signature; `advisory` signatures have no folder and produce
# guidance rather than emitted agents.
#
# `evidence` terms feed a cheap deterministic prior that runs BEFORE the model
# sees the document. The prior is a hint, never a verdict: it is compared with
# the model's diagnosis and disagreement is surfaced in the build record.

version: 1

signatures:
  - id: stale_facts
    problem: Missing or stale facts
    pattern: "00"
    paper_section: 4
    # "answer and cite" required that exact adjacency; a lot of genuinely
    # retrieval-only requests just say "quote it back" without ever using
    # "answer" or "cite" together. Widened toward that (2026-08-01, Phase 2,
    # following the Phase 1 validation checkpoint).
    # NOT added: "look it up" — bag-of-words partial credit made it fire on
    # "looking up ticket severity... mid-reasoning" (needs_tools_midreasoning's
    # renewals-copilot case), stealing that case's diagnosis via the generic
    # word "look" the two signatures both plausibly use. "Looking something
    # up" is genuinely ambiguous between one-shot retrieval and a step inside
    # a longer tool loop; the actual distinguishing signal is the multi-step/
    # live-reasoning framing, not the word "look up" itself, so it belongs on
    # needs_tools_midreasoning ("mid-reasoning" below) and NOT here.
    # "quoted back" added (2026-08-01, Phase 2 round 2) alongside "quote it
    # back" — same silent-e stemmer limitation as workflow_too_large's
    # decompose/decomposed below: stem("quoted") -> "quot", stem("quote")
    # stays "quote", so the two never match through the stemmer and both
    # forms have to be listed. "word for word" added for the same round:
    # genuinely grounding-only requests are often described by exactness of
    # the copy, not by naming "cite" or "quote" at all. "single number in" is
    # a sibling of "single answer in" — the fact being looked up is often
    # named as a number (a limit, a maximum, a rate), not as "the answer".
    # "out of date" removed in round 2: matched no true positive in the
    # golden set and bag-of-words-collided on "throws OUT the ones that
    # break a hard due DATE" in an unrelated planning-under-constraints case.
    # "pull the answer from", "straight out of" and "a lookup against" added
    # (2026-08-01, Phase 2 round 3): three more natural ways a genuinely
    # retrieval-only ask gets described (pointing at a source document)
    # without ever saying "cite" or "quote".
    evidence: [rag, retrieval, knowledge base, cannot find, already exists somewhere,
              no actions are taken, answer and cite, cite, quote it back, quoted back,
              already documented, single answer in, single number in, word for word,
              pull the answer from, straight out of, a lookup against]

  - id: weak_judgement
    problem: Correct facts, weak judgement
    pattern: "01"
    paper_section: 5
    # "weigh it differently" added (2026-08-01, Phase 2 round 2) as a sibling
    # inflection of the already-present "weigh the evidence"/"weigh the
    # facts" — same people, same facts, different conclusion is the
    # signature's own definition, and this is simply the way that gets
    # phrased when the facts themselves aren't named. "pick the best one"
    # grounds pattern 01's own summary ("select one and say why the others
    # lost") in the way people actually ask for it.
    # "can't agree which" added (2026-08-01, Phase 2 round 3): the plainest
    # possible statement of the signature's own definition (people looking
    # at the same facts and landing on different picks) — grounded directly
    # in the "Correct facts, weak judgement" problem line above.
    evidence: [wrong recommendation, first answer, weak judgement, decide whether, root cause,
              propose an assessment, commits to the first, weigh the evidence, draft a recommendation,
              bounded iterations, critique them, inconsistent recommendations, judgement call,
              considered call, reasonable call, weigh the facts, same facts different,
              weigh it differently, pick the best one, can't agree which]

  - id: needs_tools_midreasoning
    problem: Needs tools, data lookups or actions mid-reasoning
    pattern: "02"
    paper_section: 6
    # Bare "tool" was too generic a single word for a signature this specific
    # (any mention of tooling in general, not specifically live mid-reasoning
    # calls) and is a likely source of over-firing; dropped in favour of more
    # specific phrases (2026-08-01, Phase 2). "mid-reasoning"/"mid reasoning"
    # is the signature's own name and was missing from its own evidence list.
    # "call out to" removed: bag-of-words matched "fan out" + "call" in
    # workflow_too_large's own pattern summary, a coincidental collision with
    # no real semantic relationship to that signature. "check live" removed
    # for the same reason: bag-of-words matched unrelated "identity checks...
    # goes live" in a long_running_process tuning case — both words individually
    # common enough that non-adjacent bag-of-words credit is too easy to trip;
    # already covered by "checking as it goes" and "live systems" separately.
    # "act on it" and "live traffic" added (2026-08-01, Phase 2 round 2): the
    # ReAct loop this signature names (pattern 02's own summary: "Thought,
    # action, observation, repeated") is very often described as check-act-
    # observe-decide without ever naming a tool, a system, or an action verb
    # from the existing list; "live traffic" is a sibling of "live systems"
    # for the same live-conditions-mid-task framing.
    evidence: [call the api, crm, system of record, take action, update the record,
              live systems, live traffic, gathers evidence from, checking as it goes,
              react to what it finds, changes while it works,
              adjust based on what it finds, mid-reasoning, mid reasoning, act on it]

  - id: planning_under_constraints
    problem: Planning under constraints with many valid options
    pattern: "09"
    paper_section: 7
    # "technically fit" added (2026-08-01, Phase 2 round 2): a sibling of
    # "many workable"/"many possible" for the same "lots of candidates
    # superficially satisfy the ask" concept, just phrased as "fit" instead
    # of "workable"/"possible". "valid combinations" removed round 3: matched
    # no true positive in the golden set and, once the negation scanner's
    # scope was corrected to run forward from its cue instead of across the
    # whole segment (see diagnose.negated_spans), started bag-of-words-
    # matching "valid" (from an unrelated "no valid option") and "combination"
    # scattered elsewhere in an unrelated needs_tools_midreasoning case.
    # "lots of valid"/"dozens of valid" added: "many valid" required the
    # literal word "many", and a lot of genuine cases say "lots of" or
    # "dozens of" instead.
    evidence: [ordering constraints, dependency order, many valid, lots of valid, dozens of valid,
              migration order, feasible, must be migrated in, sensible one, hard constraints,
              many workable, rule out the ones that, many possible, technically fit]

  - id: multiple_interpretations
    problem: Multiple plausible interpretations, first answer often wrong
    pattern: "05"
    paper_section: 8
    evidence: [ambiguous, hypothesis, competing, first explanation, might be, usually wrong, alternatives considered, plausible]

  - id: cross_session_recall
    problem: Needs recall across sessions, personalised or accumulating context
    pattern: "06"
    paper_section: 9
    # "history" alone is too generic — "case history" and "policy history" show up in
    # unrelated domains and false-positive against long_running_process and others.
    # Require it in an explicit conversation/session phrase instead — "context across
    # sessions", not the bare "context across" (which also matches "context across
    # accounts" in an unrelated relationship-discovery scenario).
    # "personalis" relied on the stemmer to bridge "personalise"/"personalised"/
    # "personalized", but stem() applies a single suffix rule per call and a
    # pre-truncated term like "personalis" gets RE-stemmed against its own
    # suffix table (strips trailing "s" -> "personali"), which doesn't equal
    # what "personalised" stems to ("personalis") — list the real word forms
    # instead of leaning on the stemmer to reconcile a stem against a stem.
    # "shouldn't have to re-explain" added (2026-08-01, Phase 2 round 2) as a
    # sibling of the already-present "shouldn't have to repeat" — same
    # complaint, different verb. "picks up where" and "returning customer"
    # removed round 3: neither matched any true positive, and both bag-of-
    # words-collided on unrelated text ("picks it up in time... borderline
    # ones — where" for the former; "log returns... losing track of where
    # each customer is" for the latter) — each pair of words individually
    # common enough, and far enough apart, to scatter-match without either
    # being adjacent.
    evidence: [remember, previous conversation, conversation history, session history,
              personalised, personalized, context across sessions,
              each session, repeats failed, same account over,
              shouldn't have to repeat, shouldn't have to re-explain, aware of earlier]

  - id: should_improve_over_runs
    problem: Repeated task that should improve run over run
    pattern: "07"
    paper_section: 10
    # "carry forward", "inform the next" and "same mistakes" added
    # (2026-08-01, Phase 2 round 3): grounded in pattern 07's own
    # beats_baseline_when ("a captured lesson pays back the reflection
    # cost") — carrying a lesson forward so the next run is informed by it,
    # instead of every run repeating the same mistake. "recurring" removed
    # the same round: matched no true positive in the golden set at all —
    # any complaint or ticket described as "recurring" read as this
    # signature regardless of whether learning-over-time was actually the
    # point (e.g. a plain IT-ticket-triage case), pure risk with zero signal.
    # "run over run" removed the same round for the same reason: matched no
    # true positive either, and bag-of-words-collided on "run in parallel...
    # over many rounds" in an unrelated workflow-decomposition case — the
    # signature's own problem line above already names the concept without
    # needing it in the evidence list too.
    evidence: [learn from, improve over time, same task each, gets better,
              reflect, reusable skill, skill library, loads automatically next time,
              same feedback, keep getting the same, faster next time,
              picks up on that pattern, capture the fix, carry forward, inform the next, same mistakes]

  - id: long_running_process
    problem: Long-running business process with defined stages
    pattern: "08"
    paper_section: 11
    # "restarts overnight" added (2026-08-01, Phase 2 round 2): "survive a
    # restart" required both words adjacent-enough for bag-of-words credit
    # ("survive" + "restart" both present) and a lot of genuine cases only
    # name the restart, never "survive" — pattern 08's own beats_baseline_when
    # is literally "survives restarts", but that's paper language; "restarts
    # overnight" is closer to how an operator actually says it.
    # "runs for weeks" and "system restart" added (2026-08-01, Phase 2 round
    # 3): a plain time-span sibling of "several days"/"across days" for
    # processes measured in weeks rather than days, and a sibling of
    # "survive a restart"/"restarts overnight" for the common "resume after
    # a system restart" phrasing (different verb, same claim).
    evidence: [sla, case management, several days, over several, escalates, second approval,
              then either, sits in, across days, state transition, defined stages,
              picks back up, survive a restart, restarts overnight, runs for weeks,
              system restart, keep its place, persist through]

  - id: workflow_too_large
    problem: Workflow too large or heterogeneous for one agent
    pattern: "03"
    paper_section: 12
    # "decompose" vs "decomposed" don't stem to the same root (the stemmer only
    # strips trailing -ed/-ing/-s, and does nothing for silent-e verbs — see
    # diagnose.stem), so both forms are listed rather than relying on one. The
    # original terms (heterogeneous, breadth, many sources) are formal paper
    # language a requirements author rarely writes verbatim; added the more
    # natural business phrasing pattern 03 is actually defined by.
    # "splitting it up" added, "split it up" and "several steps" removed
    # (2026-08-01, Phase 2 round 2). "split it up" was a bag-of-words
    # collision magnet: "split" + "up" scattered non-adjacently in unrelated
    # text ("fault splits... why the others didn't hold up") and matched no
    # true positive in the golden set at all — pure risk, no signal.
    # "splitting it up" is its exact-phrase-safe replacement (also fixes the
    # decompose/decomposed-style stemmer gap: "splitting" stems to "splitt",
    # not "split", so the two forms never bridge through the stemmer).
    # "several steps" was the same story — matched no true positive either,
    # and bag-of-words-collided on "two blending steps... several linked
    # records" in an unrelated relationship-discovery case.
    evidence: [multiple teams, decompose, decomposed, heterogeneous, many sources,
              breadth, split the work, narrow subtasks, worker agents, small model can, in parallel,
              independent reviewer, different source system, splitting it up,
              too much for one, run side by side, different skill sets]

  - id: human_judgement_in_output
    problem: Human judgement is part of output quality, not just a gate
    pattern: "13"
    paper_section: 13
    # "a real person" added (2026-08-01, Phase 2 round 3): a plainer sibling
    # of "a person to look" for the common "we want a real person pulled in"
    # phrasing. "sign off" removed the same round: matched no true positive
    # and bag-of-words-collided on "early SIGNs of... gone OFF their feed"
    # in an unrelated veterinary-diagnosis case — "sign" (stemmed from
    # "signs") and "off" both common enough alone to scatter-match.
    evidence: [analyst decides, expert judgement, human review, senior handler,
              cannot be automated, for review before, critique, human approval on, escalate the hard,
              a person to look, a real person, real deadline, route to a reviewer, too costly to get wrong]

  - id: deterministic_policy_compliance
    problem: Deterministic policy compliance required
    pattern: "04"
    paper_section: 14
    # "no close enough" added (2026-08-01, Phase 2 round 2), grounded in
    # pattern 04's own beats_baseline_when ("not usually. A tendency is not
    # a guarantee.") — this is the plain-English version of exactly that
    # claim. It is deliberately the FULL phrase including "no": the term
    # itself is the positive evidence (see diagnose.score_signatures' fix
    # for self-negating evidence terms), not something for the negation
    # scanner to discount.
    # "zero tolerance" and "unbreakable" added (2026-08-01, Phase 2 round
    # 3): "zero tolerance" is the plainest possible restatement of "not
    # usually — it has to be guaranteed"; "unbreakable" is a single-word
    # sibling of "cannot bend"/"never bend" (same claim, same low collision
    # risk as any other single distinctive word).
    evidence: [regulation, must not, mandatory, cannot vary, set by compliance, which rule was,
              audit trail, threshold, deterministic, policy compliance, no exceptions,
              cannot bend, never bend, hard rule, has to be guaranteed, no close enough,
              zero tolerance, unbreakable]

  - id: relationship_discovery
    problem: Relationship discovery, no single document has the answer
    pattern: "10"
    paper_section: 15
    evidence: [lineage, graph, ownership, who owns, records connect, no single record,
              share a director, relationships, follow it through, several linked records,
              layers of holding, full chain, no one filing shows]

  - id: validated_artefacts
    problem: Validated artefacts required, not advice
    pattern: "11"
    paper_section: 16
    # "compliance checklist" added (2026-08-01, Phase 2 round 2): pattern
    # 11's evaluator doesn't have to be a test suite in the literal sense —
    # "pass our compliance checklist... if a clause is missing, redo it" is
    # the same free, unflatterable evaluator pattern 11's beats_baseline_when
    # describes, just for a document artefact instead of code.
    evidence: [generate code, migration script, artefact, must compile, the deliverable is,
              tests pass, fails the tests, pass or fail, look at the error and repair,
              compliance checklist]

  # Advisory signatures. No folder, no emitted agents. These change the shape of
  # the recommendation rather than adding a pattern to the composition.
  - id: quality_undefined
    problem: Nobody can say whether the output is good
    pattern: null
    advisory: evaluation_first
    paper_section: 17
    # "nobody has said" and "no agreed measure" added (2026-08-01, Phase 2
    # round 3): siblings of "nobody has agreed"/"no clear definition of
    # good" — both are deliberately self-negating full phrases (see
    # diagnose.score_signatures' fix for self-negating evidence terms),
    # since the absence itself is the positive evidence for this signature.
    evidence: [not sure how to measure, no benchmark, subjective, quality varies,
              no scorecard, nobody has agreed, nobody has said, never been measured,
              no clear definition of good, no agreed measure]

  - id: cost_latency_pressure
    problem: Cost or latency pressure at scale
    pattern: null
    advisory: routing_and_budgets
    paper_section: 18
    # "per day" was the likely dominant over-firer: any volume mention at all
    # ("200 cases per day") reads as cost/latency pressure even when cost and
    # speed were never called out as the actual constraint. Dropped in favour
    # of phrases that require cost or speed to be the explicit point
    # (2026-08-01, Phase 2, following the Phase 1 checkpoint's over-fired-
    # signatures report — this and stable_high_volume were the two largest).
    # Round 2 (2026-08-01) found the ACTUAL dominant over-firer once "per day"
    # was gone: "real time", a two-generic-word bag-of-words phrase. Neither
    # "real" nor "time" is rare enough alone to carry signal, and the two
    # scatter-matched non-adjacently in unrelated text (e.g. "real cause...
    # last time" in a root-cause case) on every occurrence checked. Removed —
    # "latency"/"seconds"/"milliseconds" already cover the genuine real-time
    # cases as single, much rarer words that can't scatter-match this way.
    # "scale" removed for the same reason (over-generic single word; the
    # signature's actual claim is cost/speed, which stable_high_volume's own
    # volume-specific terms already own better).
    evidence: [high volume, cost per, latency, seconds, throughput,
              cost per conversation, capping what we, respond within, milliseconds,
              whatever this costs]

  - id: stable_high_volume
    problem: Stable high-volume workload, orchestration cost dominates
    pattern: null
    advisory: learning_and_optimisation
    paper_section: 19
    # Bare "stable" was too generic on its own (any mature/settled process
    # reads as this) and is a likely over-firer; the signature's actual claim
    # — stability AND high volume AND unchanging shape together — is already
    # covered by the more specific phrases below (2026-08-01, Phase 2).
    # "millions" removed in round 2 (2026-08-01) for the same reason "stable"
    # was: it names only the volume half of the claim, so it fired on cases
    # that are high-volume and GROWING (the opposite of stable) whenever the
    # word happened to appear — e.g. "heading to over a million by next
    # year" is explicitly not a stable workload. "same format" added in its
    # place: it's still grounded in the actual stability half of the claim,
    # like the other phrases here, so the genuine stable+volume cases this
    # was covering for don't lose their signal.
    # "haven't changed in" and "aren't going to" added (2026-08-01, Phase 2
    # round 3): same silent-apostrophe-word tokenization gap as elsewhere —
    # "hasn't"/"haven't" and "isn't"/"aren't" tokenize to different words
    # ("hasn"+"t" vs "haven"+"t"), so the singular and plural subject-verb
    # forms need to be listed separately rather than relying on the
    # stemmer or bag-of-words to bridge them.
    evidence: [unchanged for, fine-tune, distil, same shape every time, same format,
              hasn't changed in years, haven't changed in, isn't going to change, aren't going to]
